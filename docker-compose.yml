# XRK-Yunzai：app + Redis
# docker compose up -d --build

name: xrk-yunzai

services:
  xrk-yunzai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xrk-yunzai
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DISABLE_CONSOLE: "true"
      USE_FILE_LOG: "true"
      DEBUG: "false"
      XRK_SERVER_PORT: "3000"
      NODE_OPTIONS: "--no-warnings --no-deprecation --max-old-space-size=1024"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    ports:
      - "3000-3100:3000-3100"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./plugins:/app/plugins
      - ./resources:/app/resources
      - ./renderers:/app/renderers
      - /app/node_modules
    networks:
      - xrk-network
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7.4-alpine
    container_name: xrk-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis-data:/data
    networks:
      - xrk-network
    # ports: ["6379:6379"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  xrk-network:
    driver: bridge
    name: xrk-network

volumes:
  redis-data:
    name: xrk-redis-data
    driver: local
